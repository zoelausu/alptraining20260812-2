name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      BACKEND_BASE_URL: http://localhost:7777
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        run: make install-backend

      - name: Test
        run: make test

      - name: Lint
        run: cd backend && uv run python -m compileall -q src tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: make install-frontend

      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_AGUI_AGENT_URL: http://localhost:7777/agui
